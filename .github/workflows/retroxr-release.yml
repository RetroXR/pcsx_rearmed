# Build the retroXR pcsx_rearmed core for Windows and Android and publish it as
# a release, so retroXR's CoreDownloadManager can fetch it.
#
# This fork carries the PlayStation link cable. SIO1 -- the serial port at
# 1F801050h -- had never been emulated at all: sio1ReadStat16 returned a bare
# 0xa0 and nothing else existed. libpcsxcore/sio1.c implements it and
# frontend/sio1_netlink.c speaks `psx-sio-1` over a bus the frontend hosts.
#
# With no driver installed the port still answers 0xa0, which is what every
# existing session sees and what stops Armored Core and F1 misdetecting a cable.
# pcsx_rearmed_link_cable is on by default and is not restart-time.
#
#   Windows  pcsx_rearmed_libretro.dll.zip          containing pcsx_rearmed_libretro.dll
#   Android  pcsx_rearmed_libretro_android.so.zip   containing pcsx_rearmed_libretro_android.so
#
# Windows is cross-compiled from Ubuntu with mingw-w64. platform=win is passed
# explicitly and is the single most important line here: Makefile.libretro picks
# its platform from uname, and getting that wrong does not fail cleanly -- the
# build silently becomes a unix target and the first symptom is a missing
# sys/mman.h from lightrec, because the unix branch never adds -Iinclude/mman.
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form so shipping a build needs no app update, and GitHub's `latest` skips
# prereleases. Anything else cut on this fork should be marked prerelease.
name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-pcsx-rearmed-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

jobs:
  windows:
    name: Windows x86_64 (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 make zip

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          make -f Makefile.libretro platform=win \
            CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
            -j$(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find . -maxdepth 2 -name 'pcsx_rearmed_libretro.dll' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one pcsx_rearmed_libretro.dll, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/pcsx_rearmed_libretro.dll
          (cd stage && zip -q -X ../pcsx_rearmed_libretro.dll.zip pcsx_rearmed_libretro.dll)
          file stage/pcsx_rearmed_libretro.dll
          ls -lh pcsx_rearmed_libretro.dll.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pcsx_rearmed_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip
          # Into RUNNER_TEMP, NOT the workspace. This step runs before
          # actions/checkout, and checkout clears the workspace it checks into --
          # so an NDK unpacked at $PWD here exists at the end of this step and is
          # gone by the time the build runs. The failure is a bare
          # "ndk-build: command not found", which says nothing about why.
          wget -q -O "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/android-ndk-r27d" >> $GITHUB_PATH

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Application.mk says APP_ABI := all; arm64-v8a is named here so the run
      # builds the one ABI retroXR ships rather than every ABI the NDK knows.
      - name: Build
        run: |
          cd jni
          ndk-build APP_ABI=arm64-v8a -j$(nproc)

      # LOCAL_MODULE is `retro`, so ndk-build emits a libretro.so that says
      # nothing about which core it is. Renamed on the way into the zip to the
      # name the asset advertises and the installer expects.
      - name: Package
        run: |
          # libs/, not obj/. ndk-build leaves an unstripped copy in
          # obj/local/<abi>/ and INSTALLS the deliverable to libs/<abi>/, so a
          # search for the bare name finds two and the bigger one is the wrong
          # one. The exactly-one check below is what turned that into a failed
          # run rather than a core shipped with its debug info attached.
          mapfile -t hits < <(find . -path '*/libs/arm64-v8a/*' -name 'libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one arm64-v8a libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/pcsx_rearmed_libretro_android.so
          (cd stage && zip -q -X ../pcsx_rearmed_libretro_android.so.zip pcsx_rearmed_libretro_android.so)
          file stage/pcsx_rearmed_libretro_android.so
          ls -lh pcsx_rearmed_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: pcsx_rearmed_libretro_android.so.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<EOF
          pcsx_rearmed libretro core built for retroXR, from \`$GITHUB_SHA\`.

          Windows x86_64 and Android arm64-v8a. The source for these binaries is
          this tag.

          Over the stock buildbot build this emulates SIO1, the serial port at
          1F801050h, which had never been emulated -- and speaks it over a link
          bus the frontend hosts, so two consoles in one room can be cabled
          together. With no bus the port answers exactly what it always did.

          It also lets the frontend own the memory card in slot 2, as it could
          already own slot 1's: pcsx_rearmed_memcard2 gains a 'libretro' value,
          and that card is published under a core-specific memory id,
          (1 << 8) | RETRO_MEMORY_SAVE_RAM. SAVE_RAM still means card 1.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "pcsx_rearmed (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/pcsx_rearmed_libretro.dll.zip \
            dist/pcsx_rearmed_libretro_android.so.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
